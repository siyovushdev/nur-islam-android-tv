name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePhoneDebug :app:test :app:lintDebug :app:lintRelease :app:lintPhoneDebug :app:assembleDebugAndroidTest
      - name: Verify and prepare signed phone APK
        run: |
          mkdir -p app/build/distributions
          cp app/build/outputs/apk/phoneDebug/app-phoneDebug.apk app/build/distributions/Nur-Islam-Phone-Debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/distributions/Nur-Islam-Phone-Debug.apk > app/build/distributions/signature.txt
          cd app/build/distributions
          sha256sum Nur-Islam-Phone-Debug.apk > Nur-Islam-Phone-Debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-phone-debug
          path: app/build/distributions/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-screenshots
          path: |
            app/build/reports/
            app/build/screenshots/
