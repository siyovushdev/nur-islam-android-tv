name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check distribution safety guards
        run: python3 scripts/test-release-tools.py
      - name: Build and verify all variants
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER * 2))
          ./gradlew -PnurIslamVersionCode="$code" :app:assembleDebug :app:assembleRelease :app:assemblePhoneRelease :app:assemblePhoneDebug :app:test :app:lintDebug :app:lintRelease :app:lintPhoneRelease :app:lintPhoneDebug :app:assembleDebugAndroidTest
          mkdir -p test-binaries/base test-binaries/updated
          cp app/build/outputs/apk/debug/app-debug.apk test-binaries/base/tv.apk
          cp app/build/outputs/apk/phoneDebug/app-phoneDebug.apk test-binaries/base/phone.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk test-binaries/tv-androidTest.apk
          ./gradlew -PnurIslamVersionCode="$((code + 1))" :app:assembleDebug :app:assemblePhoneDebug
          cp app/build/outputs/apk/debug/app-debug.apk test-binaries/updated/tv.apk
          cp app/build/outputs/apk/phoneDebug/app-phoneDebug.apk test-binaries/updated/phone.apk
          python3 scripts/check-apk-manifests.py test-binaries/updated/tv.apk test-binaries/updated/phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: test-binaries/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-screenshots
          retention-days: 14
          path: |
            app/build/reports/
            app/build/screenshots/
  sign-test-apks:
    needs: build
    # Fork code never receives the persistent signing material.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: test-binaries
      - name: Sign only test packages using the persistent external key
        env:
          NUR_ISLAM_TEST_KEYSTORE_B64: ${{ secrets.NUR_ISLAM_TEST_KEYSTORE_B64 }}
          NUR_ISLAM_TEST_KEYSTORE_PASSWORD: ${{ secrets.NUR_ISLAM_TEST_KEYSTORE_PASSWORD }}
          NUR_ISLAM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_signing_dir="$RUNNER_TEMP/nur-islam-test-signing"
          mkdir -p "$task_signing_dir"
          trap 'rm -rf "$task_signing_dir"' EXIT
          export NUR_ISLAM_SIGNING_DIRECTORY="$task_signing_dir"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          directory = Path(os.environ['NUR_ISLAM_SIGNING_DIRECTORY'])
          key = os.environ['NUR_ISLAM_TEST_KEYSTORE_B64']
          password = os.environ['NUR_ISLAM_TEST_KEYSTORE_PASSWORD']
          if not key or not password:
              raise SystemExit('Persistent test signing secrets are missing; no installable distribution published')
          (directory / 'test.jks').write_bytes(base64.b64decode(key, validate=True))
          (directory / 'password').write_text(password)
          PY
          unset NUR_ISLAM_TEST_KEYSTORE_B64 NUR_ISLAM_TEST_KEYSTORE_PASSWORD
          python3 scripts/sign-test-apks.py --input test-binaries --output distributions --keystore "$task_signing_dir/test.jks" --password-file "$task_signing_dir/password"
          cp app/src/test/resources/xlsx/kazan-2026.xlsx distributions/phone/TEST-Kazan-2026.xlsx
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          sha = os.environ['NUR_ISLAM_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          # Downloaded instructions must survive deletion of the Draft PR branch.
          guide = Path('docs/APK_INSTALL.md').read_text().replace('/blob/codex/product-readiness/', f'/blob/{sha}/')
          for variant in ('phone', 'tv'):
              Path(f'distributions/{variant}/INSTALL.md').write_text(guide)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-phone-debug
          path: distributions/phone/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nur-islam-tv-debug
          path: distributions/tv/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: signed-test-support
          path: distributions/support/
          if-no-files-found: error
          retention-days: 7
  phone-install:
    needs: sign-test-apks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nur-islam-phone-debug
          path: phone-apk
      - uses: actions/download-artifact@v4
        with:
          name: signed-test-support
          path: support
      - uses: actions/download-artifact@v4
        with:
          name: nur-islam-tv-debug
          path: home-apk
      - name: Enable KVM on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install/update published APK, XLSX/JSON, Ramadan and real-time iqamah
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Pixel Launcher in the Google image repeatedly ANRs during first boot,
          # before app input. Use the official AOSP image, keeping every app check.
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            python3 scripts/check-product-apk.py phone-apk/Nur-Islam-Phone-Debug.apk --baseline support/phone-baseline.apk --package dev.nurislam.tv.phone.debug --output phone-emulator-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-emulator-install
          path: phone-emulator-results/
  tv-install:
    needs: sign-test-apks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nur-islam-tv-debug
          path: tv-apk
      - uses: actions/download-artifact@v4
        with:
          name: signed-test-support
          path: support
      - name: Enable KVM on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android TV installation/update and D-pad (HOME unchanged)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: python3 scripts/check-tv-apk.py tv-apk/Nur-Islam-TV-Debug.apk --baseline support/tv-baseline.apk --tests support/tv-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-emulator-install
          path: tv-emulator-results/

  release-install:
    # GitHub only exposes draft releases to tokens with push access.
    permissions:
      contents: write
    needs: build
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/simple-mosque-calendar'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Phone
            package: dev.nurislam.tv.phone
            api: 35
            target: default
            arch: x86_64
            profile: pixel_5
          - variant: TV
            package: dev.nurislam.tv
            api: 34
            target: android-tv
            arch: x86
            profile: tv_1080p
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact externally signed RC and previous public RC
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p release-apk previous-apk
          gh release download v0.4.0-rc1 --dir release-apk
          gh release download v0.3.0-rc3 --pattern 'Nur-Islam-*-Release.apk' --dir previous-apk
          test "$(cat release-apk/SOURCE_SHA.txt)" = "$SOURCE_SHA"
          cd release-apk
          sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify final Release identities, flags and signatures
        run: |
          python3 scripts/check-apk-manifests.py release-apk/Nur-Islam-TV-Release.apk release-apk/Nur-Islam-Phone-Release.apk --release
          for apk in release-apk/*-Release.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.verify.txt"
            grep -F "$(cat config/release-signing-cert.sha256)" "$apk.verify.txt"
          done
      - name: Enable KVM on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          NUR_ISLAM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: python3 scripts/check-product-apk.py release-apk/Nur-Islam-${{ matrix.variant }}-Release.apk --baseline previous-apk/Nur-Islam-${{ matrix.variant }}-Release.apk --package ${{ matrix.package }} --output release-emulator-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.variant }}-acceptance
          path: release-emulator-results/
